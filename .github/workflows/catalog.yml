name: Catalog

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      news: ${{ steps.news.outputs.text }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: work
          key: crawl-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: crawl-

      - name: Start from the published catalog
        run: |
          mkdir -p work
          cp app/src/main/assets/catalog.json work/seed.json
          curl -fsSL https://wingedpanther.github.io/openshelf/catalog.json -o previous.json && cp previous.json app/src/main/assets/catalog.json || true
          curl -fsSL https://wingedpanther.github.io/openshelf/new.json -o new-before.json || true
          rm -f work/discover.json work/enrich.json work/forks.json

      - name: Crawl GitHub
        env:
          GH_TOKEN: ${{ secrets.CRAWL_TOKEN }}
        timeout-minutes: 330
        run: python3 -I tools/crawl.py work discover enrich forks inspect art build

      - uses: actions/cache/restore@v4
        with:
          path: vt
          key: vt-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vt-

      - name: Look up APKs on VirusTotal
        env:
          VT_KEY: ${{ secrets.VT_KEY }}
        timeout-minutes: 90
        continue-on-error: true
        run: |
          [ -f vt/vt.json ] || { mkdir -p vt && cp work/vt.json vt/ 2>/dev/null; } || true
          python3 -I tools/scan.py app/src/main/assets/catalog.json vt previous.json

      - name: Keep VirusTotal results
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vt
          key: vt-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep crawl progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work
          key: crawl-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Sign and build the site
        env:
          CATALOG_KEY: ${{ secrets.CATALOG_KEY }}
        run: |
          umask 077
          printf '%s\n' "$CATALOG_KEY" > "$RUNNER_TEMP/key.pem"
          CATALOG_KEY_FILE="$RUNNER_TEMP/key.pem" python3 -I tools/publish.py app/src/main/assets/catalog.json site --before previous.json work/seed.json --history new-before.json
          rm "$RUNNER_TEMP/key.pem"

      - name: Write the Discord message
        id: news
        run: echo "text=$(python3 -I tools/announce.py site)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  announce:
    needs: [crawl, deploy]
    if: needs.crawl.outputs.news != ''
    runs-on: ubuntu-latest
    steps:
      - name: Post the new apps to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEXT: ${{ needs.crawl.outputs.news }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No DISCORD_WEBHOOK secret, nothing posted"; exit 0; fi
          jq -n --arg c "$TEXT" '{content: $c, allowed_mentions: {parse: []}}' | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
